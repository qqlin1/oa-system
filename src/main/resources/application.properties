spring.application.name=oa-system
server.port=${SERVER_PORT:8080}

spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/oa_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 并发测试需要：默认连接池只有 10 个连接，20 个线程会有 10 个在排队等连接，
# 测出来的「同时性」是打折的。MySQL 单机默认最大连接数 151，设 30 安全。
spring.datasource.hikari.maximum-pool-size=30

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:7200000}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:3s}
spring.data.redis.timeout=${REDIS_TIMEOUT:3s}

# 文件上传。默认存到项目根目录下的 uploads/，路径可用环境变量覆盖
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# 单次请求的大小上限。
# 注意：这个限制管的是【单个 HTTP 请求】，不是文件总大小 ——
# 分片上传时每个请求只带一片，所以这里给 12MB 就够了，
# 而业务上允许的总大小（200MB）由 FileService 里的常量控制。
# 这也是分片上传能绕过容器限制的原因：大文件被切成了很多个小请求。
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:12MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:12MB}

# RocketMQ。用原生客户端自己封装，所以这里只是普通配置项，不依赖 starter 的自动装配。
rocketmq.name-server=${ROCKETMQ_NAME_SERVER:localhost:9876}
rocketmq.topic.leave-result=${ROCKETMQ_TOPIC_LEAVE_RESULT:LEAVE_APPROVAL_TOPIC}
rocketmq.producer.group=${ROCKETMQ_PRODUCER_GROUP:oa-leave-producer}
rocketmq.consumer.group=${ROCKETMQ_CONSUMER_GROUP:oa-notification-consumer}
